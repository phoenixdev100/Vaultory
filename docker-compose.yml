# Vaultory self-hosted stack: Postgres + migrations + API + web (nginx).
#
# ZERO-CONFIG - no .env file needed, every value below has a baked-in default:
#
#   docker compose pull     # fetch the 2 app images from Docker Hub
#   docker compose up -d    # app on http://localhost:5173
#
# Build & publish the images yourself:
#
#   docker login
#   docker compose build
#   docker compose push   # pushes vaultory-backend + vaultory-frontend
#
# The api container runs `prisma migrate deploy` at boot (idempotent) - no
# separate migrate image or manual step.
#
# Every setting still accepts a real env-var override (${VAR:-default}).
#
# SECURITY: the baked SESSION_SECRET / VAULT_WRAP_SECRET / POSTGRES_PASSWORD
# are labeled dev placeholders - fine for a private local install, but for any
# shared/public deployment override all three with real random secrets:
#   openssl rand -base64 48

name: vaultory

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaultory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaultory-local-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-vaultory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    image: phoenixdev100/vaultory-backend:1.0.0
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-vaultory}:${POSTGRES_PASSWORD:-vaultory-local-postgres-password}@db:5432/${POSTGRES_DB:-vaultory}
      DIRECT_URL: postgresql://${POSTGRES_USER:-vaultory}:${POSTGRES_PASSWORD:-vaultory-local-postgres-password}@db:5432/${POSTGRES_DB:-vaultory}
      SESSION_SECRET: ${SESSION_SECRET:-vaultory-local-session-secret-for-dev-only}
      VAULT_WRAP_SECRET: ${VAULT_WRAP_SECRET:-vaultory-local-vault-wrap-secret-dev-only}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      AUTO_LOCK_MINUTES: ${AUTO_LOCK_MINUTES:-15}
      APP_URL: ${APP_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # nginx proxies /api same-origin - Lax cookies are enough.
      CROSS_SITE_COOKIES: "false"
      # console transport sends nothing - flip to smtp + add SMTP_* vars to mail.
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-console}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      # EMAIL_FROM: ${EMAIL_FROM:-}
      # SMTP_HOST: ${SMTP_HOST:-}
      # SMTP_PORT: ${SMTP_PORT:-587}
      # SMTP_SECURE: ${SMTP_SECURE:-false}
      # SMTP_USER: ${SMTP_USER:-}
      # SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: phoenixdev100/vaultory-frontend:1.0.0
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  pgdata:
